# Temporary dependency bootstrap for feat/mobile. Removed once the lock blob is
# reviewed and attached to the PR. Never writes a branch, deploys, or uses secrets.
name: Mobile dependency bootstrap
on:
  pull_request:
    paths: ['mobile/package.json', '.github/workflows/mobile-bootstrap.yml']
permissions:
  contents: read
jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Resolve initial lock without dependency lifecycle scripts
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Store lock as an unattached Git blob for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('/tmp/blob.json',JSON.stringify({content:fs.readFileSync('mobile/package-lock.json','utf8'),encoding:'utf-8'}));"
          gh api --method POST "repos/$REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha > lock-blob-sha.txt
          cat lock-blob-sha.txt
          git archive --format=tar.gz -o mobile-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-bootstrap
          path: |
            lock-blob-sha.txt
            mobile/package-lock.json
            mobile-source.tar.gz
          retention-days: 1
