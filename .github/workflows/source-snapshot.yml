name: Source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'codex/production-readiness' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/fintrack-current.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot
          path: /tmp/fintrack-current.tar.gz
          retention-days: 1
