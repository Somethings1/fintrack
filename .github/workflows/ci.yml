name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: server/go.sum
      - run: go mod download && go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Race-tested suite
        if: ${{ !cancelled() }}
        run: go test -race -shuffle=on -count=1 -timeout=120s ./...
      - name: Build
        if: ${{ !cancelled() }}
        run: go build -trimpath -o /tmp/fintrack .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck and build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
  required:
    name: Required CI
    if: ${{ always() }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: test "$BACKEND" = success && test "$FRONTEND" = success
