version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    ignore:
      # Frontend major upgrades routinely couple framework, compiler, lint and UI
      # migrations. Keep minor/patch version updates and security updates automatic,
      # but handle majors deliberately in coordinated PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /server
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /server
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /web
    schedule: {interval: weekly}
    ignore:
      # Production intentionally follows the Node 22 runtime contract declared
      # in web/package.json; major runtime migrations are manual.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /deploy/edge
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule: {interval: weekly}
    ignore:
      # This image serves legacy MongoDB migration/backup workflows. A database
      # major upgrade needs an explicit compatibility and restore review.
      - dependency-name: mongo
        update-types: ["version-update:semver-major"]
