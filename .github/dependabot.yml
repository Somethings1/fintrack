version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /server
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /server
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /web
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /deploy/edge
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule: {interval: weekly}
