# LOCAL DEVELOPMENT ONLY: disposable PostgreSQL. Supabase remains the auth provider.
name: fintrack-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_DB: fintrack
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U fintrack -d fintrack']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./server
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://fintrack:fintrack@postgres:5432/fintrack?sslmode=disable
      SUPABASE_URL: ${SUPABASE_URL:?Provide a development Supabase project URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Provide a public development anon key}
      ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_MODEL: ${AGENT_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_CHANGES_DISABLED: ${AGENT_CHANGES_DISABLED:-false}
      AGENT_INPUT_MICRO_USD_PER_MILLION: ${AGENT_INPUT_MICRO_USD_PER_MILLION:-}
      AGENT_CACHED_MICRO_USD_PER_MILLION: ${AGENT_CACHED_MICRO_USD_PER_MILLION:-}
      AGENT_OUTPUT_MICRO_USD_PER_MILLION: ${AGENT_OUTPUT_MICRO_USD_PER_MILLION:-}
      CRON_ENABLED: ${CRON_ENABLED:-false}
      LEDGER_CURRENCY: ${LEDGER_CURRENCY:-USD}
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure
  web:
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports: ['127.0.0.1:8088:8080']
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
