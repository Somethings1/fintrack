# These quotas run BEFORE expensive authentication. Do not trust arbitrary XFF.
# Behind the bundled single edge proxy the per-address quota is intentionally
# conservative and shared. For scale, configure an audited trusted-proxy CIDR.
limit_req_zone $binary_remote_addr zone=preauth:10m rate=30r/s;
limit_req_zone $server_name zone=global_api:1m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /readyz { proxy_pass http://api:8080/readyz; }
    location /api/ {
        limit_req zone=preauth burst=60 nodelay;
        limit_req zone=global_api burst=200 nodelay;
        limit_conn connections 100;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location /assets/ {
        expires 1y;
        # expires creates Cache-Control without overriding inherited security headers.
        try_files $uri =404;
        access_log off;
    }
    location = /index.html { expires -1; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
